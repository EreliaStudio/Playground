name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-release
  VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
  GALLIUM_DRIVER: llvmpipe
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: '460'

jobs:
  cpu-tests:
    name: CPU/headless tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: Playground
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download pinned Sparkle package
        working-directory: Playground
        run: ./tools/ci/install-sparkle-package.ps1 -Destination build/dependencies/sparkle
      - name: Clean configure with installed Sparkle TestLibrary feature
        working-directory: Playground
        run: |
          & cmake -S . -B build/ci -G Ninja `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_OVERLAY_TRIPLETS="$pwd/tools/ci/triplets" `
            -DCMAKE_PREFIX_PATH="$env:SPARKLE_PREFIX" `
            -DBUILD_TESTING=ON 2>&1 | Tee-Object ci-configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Playground configure failed' }
      - name: Build CPU/headless tests
        working-directory: Playground
        run: cmake --build build/ci --target PlaygroundTest --parallel 4
      - name: Verify prebuilt Sparkle consumption
        working-directory: Playground
        run: >-
          ./tools/ci/verify-prebuilt-sparkle.ps1
          -BuildDirectory build/ci
          -Prefix $env:SPARKLE_PREFIX
          -ConfigureLog ci-configure.log
      - name: Run without OpenGL initialization
        working-directory: Playground
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error -L cpu --output-junit cpu-results.xml
      - name: Prove Sparkle has no runtime DLL dependency
        working-directory: Playground
        run: |
          $executables = Get-ChildItem build/ci -Recurse -File -Filter *.exe
          if (-not $executables) { throw 'No Playground executable was produced' }
          foreach ($executable in $executables) {
            $dependencies = (& dumpbin /dependents $executable.FullName | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $($executable.FullName)" }
            if ($dependencies -match '(?im)^\s*Sparkle.*\.dll\s*$') {
              throw "Unexpected Sparkle runtime DLL dependency in $($executable.FullName)"
            }
          }
      - name: Upload CPU diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-headless-results
          path: |
            Playground/build/ci/Testing
            Playground/build/ci/cpu-results.xml
            Playground/ci-configure.log
            Playground/build/ci/CMakeFiles/CMakeConfigureLog.yaml

  gpu-golden-tests:
    name: Windows/OpenGL golden candidates
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: Playground
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download pinned Sparkle package
        working-directory: Playground
        run: ./tools/ci/install-sparkle-package.ps1 -Destination build/dependencies/sparkle
      - name: Clean configure
        working-directory: Playground
        run: |
          & cmake -S . -B build/ci -G Ninja `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_OVERLAY_TRIPLETS="$pwd/tools/ci/triplets" `
            -DCMAKE_PREFIX_PATH="$env:SPARKLE_PREFIX" `
            -DBUILD_TESTING=ON 2>&1 | Tee-Object ci-configure.log
          if ($LASTEXITCODE -ne 0) { throw 'Playground configure failed' }
      - name: Build GPU test
        working-directory: Playground
        run: cmake --build build/ci --target PlaygroundTest --parallel 4
      - name: Verify prebuilt Sparkle consumption
        working-directory: Playground
        run: >-
          ./tools/ci/verify-prebuilt-sparkle.ps1
          -BuildDirectory build/ci
          -Prefix $env:SPARKLE_PREFIX
          -ConfigureLog ci-configure.log
      - name: Install canonical software OpenGL
        run: ./Playground/tools/ci/install-mesa.ps1 -Destination Playground/build/ci/tests
      - name: Run GPU capture, comparison, and sensitivity gate
        working-directory: Playground
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error -L gpu --output-junit gpu-results.xml
      - name: Upload proposed expected images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-chunk-expected-candidates
          path: Playground/build/ci/tests/expectedImages
          if-no-files-found: warn
          retention-days: 30
      - name: Upload actual images and differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-chunk-visual-results
          path: |
            Playground/build/ci/tests/results
            Playground/build/ci/Testing
            Playground/build/ci/gpu-results.xml
            Playground/ci-configure.log
            Playground/build/ci/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: error
          retention-days: 30
      - name: Commit approved golden references
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/feat/current-chunk-regression-characterization'
        working-directory: Playground
        run: |
          $source = 'build/ci/tests/expectedImages/current_chunk'
          $destination = 'tests/resources/expectedImages/current_chunk'
          if (-not (Test-Path $source)) {
            Write-Host 'No missing golden references were generated.'
            exit 0
          }
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item "$source/*" $destination -Force
          git add -- tests/resources/expectedImages/current_chunk
          if (git diff --cached --quiet) {
            Write-Host 'Golden references are already committed.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add approved current Chunk golden references'
          git push origin "HEAD:$env:GITHUB_REF_NAME"
